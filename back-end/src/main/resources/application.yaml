spring:
  application:
    name: datashare-backend
  config:
    import: optional:file:../.env[.properties]   # lit le .env de la racine
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # crée/met à jour les tables à partir des entités
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health       # pas '*', contrairement à EduBibliotheque

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000   # 1 heure
  download-ticket-expiration-ms: 60000

app:
  storage:
    location: ./uploads
  cleanup:
    cron: "0 0 3 * * *"   # tous les jours à 3 h du matin