server {
    # Port non privilégié : nginx tourne sans les droits root dans le conteneur
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Les appels /api sont transmis au service back-end du Compose
    location /api/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fichiers jusqu'à 1 Go, transmis au back-end au fil de l'envoi plutôt que stockés d'abord par nginx
        client_max_body_size 1g;
        proxy_request_buffering off;
    }

    # Routes Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
