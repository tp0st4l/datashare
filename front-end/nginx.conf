server {
    listen 80;
    root /usr/share/nginx/html;

    # Compression, comme en production
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Les appels /api partent vers le back-end Spring Boot sur la machine hôte
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        client_max_body_size 1g;
    }

    # Routes Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}